spring.application.name=springsqlite
spring.datasource.url=${DB_URL:jdbc:sqlite:springdb.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
gg.jte.template-suffix=.jte
gg.jte.use-precompiled-templates=true
spring.flyway.enabled=true

# --- MyBatis ---
# XML statements live next to the mappers; `User` is referenced by its simple name
# thanks to the type-alias package.
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.type-aliases-package=com.example.springjte.model
mybatis.type-handlers-package=com.example.springjte.config
# users.email_verified / pending_email / created_at -> emailVerified / pendingEmail / createdAt
mybatis.configuration.map-underscore-to-camel-case=true
# A nullable parameter (e.g. User.role) must bind as SQL NULL; the default OTHER
# type is rejected by some drivers, SQLite included.
mybatis.configuration.jdbc-type-for-null=NULL

# --- SaaS Features ---
# Webhook delivery timeout in seconds
saas.webhook.timeout-seconds=10
# Webhook max retry attempts
saas.webhook.max-retries=2
# API key prefix
saas.api-key.prefix=sk_
# Audit log retention in days (0 = keep forever)
saas.audit.retention-days=0
# Usage event retention in days (0 = keep forever)
saas.usage.retention-days=90

# --- RAG / LLM ---
rag.ollama.base-url=${RAG_OLLAMA_BASE_URL:http://localhost:11434}
rag.ollama.model=llama3.2
rag.ollama.embedding-model=nomic-embed-text
rag.ollama.timeout-seconds=60
rag.chunk.size=500
rag.chunk.overlap=50
rag.retrieval.top-k=5
rag.retrieval.similarity-threshold=0.7
